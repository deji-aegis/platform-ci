name: Kyverno Policy Validation

on:
  workflow_call:
    inputs:
      helm_chart_path:
        required: true
        type: string
      helm_namespace:
        required: true
        type: string

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Checkout Policies
        uses: actions/checkout@v4
        with:
          repository: deji-aegis/platform-policies
          path: platform-policies
          token: ${{ secrets.GITHUB_TOKEN }} # or GITOPS_TOKEN if it's private

      - name: Render Helm Chart
        run: |
          helm template my-app ${{ inputs.helm_chart_path }} \
            -f ${{ inputs.helm_chart_path }}/values-dev.yaml \
            --namespace ${{ inputs.helm_namespace }} > rendered-manifests.yaml

      - name: Install Kyverno CLI
        run: |
          curl -LO https://github.com/kyverno/kyverno/releases/download/v1.11.4/kyverno-cli_v1.11.4_linux_x86_64.tar.gz
          tar -xvf kyverno-cli_v1.11.4_linux_x86_64.tar.gz
          sudo mv kyverno /usr/local/bin/

      - name: Validate manifests against policies
        run: |
          kyverno apply ./platform-policies/kyverno/security/ --resource rendered-manifests.yaml