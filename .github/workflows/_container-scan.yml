name: Reusable - Container Scan

on:
  workflow_call:
    inputs:
      image_ref:
        type: string
        required: true
      severity:
        type: string
        default: "CRITICAL,HIGH"
      fail_on_finding:
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          image-ref: ${{ inputs.image_ref }}
          format: sarif
          output: trivy-image.sarif
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.fail_on_finding && '1' || '0' }}
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif