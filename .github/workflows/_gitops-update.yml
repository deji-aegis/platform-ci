name: Reusable - GitOps Update

on:
  workflow_call:
    inputs:
      gitops_repo:
        type: string
        required: true
      app_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      image_digest:
        type: string
        required: true
      auto_merge:
        type: boolean
        default: false
    secrets:
      GITOPS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  update:
    name: Open GitOps PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - name: Install yq
        uses: mikefarah/yq@21e2fdaea2abeef46a5d44fc475852fe45d48065 # v4.9.8
        with:
          cmd: yq --version

      - name: Update Image Digest and Tag
        run: |
          cd gitops-repo
          FILE="applications/${{ inputs.app_name }}/${{ inputs.environment }}/values.yaml"
          
          # Update the digest to the new SHA256
          yq -i '.image.digest = "${{ inputs.image_digest }}"' "$FILE"
          
          # Update the tag to "null" or your version so it forces ArgoCD to pull the new digest
          yq -i '.image.tag = "sha-${{ github.sha }}"' "$FILE"
          
          echo "Updated values.yaml:"
          cat "$FILE"

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7
        with:
          path: gitops-repo
          token: ${{ secrets.GITOPS_TOKEN }}
          branch: "aegis/${{ inputs.app_name }}-${{ inputs.environment }}-${{ github.sha }}"
          base: main
          commit-message: "chore(${{ inputs.app_name }}): update image for ${{ inputs.environment }}"
          title: "Update ${{ inputs.app_name }} (${{ inputs.environment }})"
          body: |
            Automated GitOps update from `${{ github.repository }}`.

            | Field | Value |
            |---|---|
            | App | `${{ inputs.app_name }}` |
            | Environment | `${{ inputs.environment }}` |
            | Image digest | `${{ inputs.image_digest }}` |
            | Source commit | `${{ github.sha }}` |
            | Source workflow | `${{ github.workflow }}` |

            Argo CD will sync this to the cluster once merged.
          labels: |
            gitops
            automated
            ${{ inputs.environment }}
          delete-branch: true

      - name: Enable auto-merge (dev only)
        if: inputs.auto_merge && inputs.environment == 'dev'
        working-directory: gitops-repo
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"