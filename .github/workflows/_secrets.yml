name: Reusable - Secrets Scan

on:
  workflow_call:
    inputs:
      fail_on_finding:
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      # Gitleaks fails the job by default on findings when configured,
      # but we enforce explicitly here to keep the behaviour predictable.
      - name: Fail on finding
        if: inputs.fail_on_finding == false
        run: echo "Soft-fail mode — findings reported but build continues"