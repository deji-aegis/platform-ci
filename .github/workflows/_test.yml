name: _test

on:
  workflow_call:
    inputs:
      coverage_threshold:
        type: number
        default: 80

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Run tests
        env:
          WATTZGOAT_BASE_URL: https://127.0.0.1:5000
        run: |
          # Start the app in the background
          python run.py &
          sleep 5
          pytest tests/ -v