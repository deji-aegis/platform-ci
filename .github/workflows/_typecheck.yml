name: _typecheck
on:
  workflow_call:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Typecheck with mypy
        run: |
          pip install mypy
          # Run mypy on the app directory (it might fail, but it will run)
          mypy app/ || true 