name: Reusable - SLSA Provenance

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
      image_digest:
        type: string
        required: true
      aws_region:
        type: string
        default: eu-west-2
      registry:
        type: string
        required: true
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write
  packages: write
  actions: read

jobs:
  get-ecr-token:
    runs-on: ubuntu-latest
    outputs:
      password: ${{ steps.get-pass.outputs.password }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - name: Get ECR password
        id: get-pass
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ inputs.aws_region }})" >> "$GITHUB_OUTPUT"


  provenance:
    needs: get-ecr-token
    name: Generate SLSA L3 Provenance
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ inputs.registry }}/${{ inputs.image_name }} 
      digest: ${{ inputs.image_digest }}
      registry-username: "AWS"
    secrets:
      registry-password: ${{ needs.get-ecr-token.outputs.password }} 