name: Reusable - IaC Scan

on:
  workflow_call:
    inputs:
      scan_path:
        type: string
        default: "."
      fail_on_finding:
        type: boolean
        default: true
      checkov_severity:
        type: string
        default: "HIGH,CRITICAL"
      frameworks:
        type: string
        default: "all"

permissions:
  contents: read
  security-events: write
  

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@1e5f6a1f9c5c8e8c5b0d5e5f5a5c5e5f5a5c5e5f # placeholder — pin to real SHA
        with:
          directory: ${{ inputs.scan_path }}
          framework: ${{ inputs.frameworks }}
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
          quiet: true
          skip_check: CKV_K8S_37,CKV_K8S_23    # example skips — tune per project

      - name: Evaluate results
        run: |
          if [ "${{ steps.checkov.outcome }}" = "failure" ] && [ "${{ inputs.fail_on_finding }}" = "true" ]; then
            echo "::error::Checkov found policy violations"
            exit 1
          fi

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

